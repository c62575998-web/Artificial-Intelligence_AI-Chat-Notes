<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mori｜對話記憶與主題筆記</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='chat.css') }}">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="#chat" aria-label="Mori 聊天首頁"><span class="brand-icon" aria-hidden="true">◉</span><span>mori</span></a>
      <div class="top-actions"><button id="organize" type="button" class="top-action" title="整理筆記">整理筆記</button><a href="#search" class="top-action" aria-label="查詢記憶" title="查詢記憶">⌕</a></div>
    </header>
    <main class="main">
      <p id="status" role="status" aria-live="polite"></p>
      <section id="page-chat" class="page chat-page" aria-label="聊天">
        <div class="chat-profile"><div class="profile-avatar" aria-hidden="true">◡</div><div><h1>Mori</h1><p>你的日常聊天夥伴 · 原型版</p></div></div>
        <div id="messages" class="conversation" role="log" aria-label="對話內容" aria-live="polite"></div>
        <div class="composer"><form id="chat-form"><div class="input-row"><button id="example" class="plus-button" type="button" aria-label="填入範例訊息" title="填入範例訊息">＋</button><label class="sr-only" for="chat-text">傳送訊息</label><textarea id="chat-text" rows="1" required placeholder="傳送訊息…"></textarea><button type="submit" class="send-button" aria-label="送出訊息">↑</button></div></form><p class="chat-hint">Enter 送出 · Shift + Enter 換行　｜　整理筆記時請輸入明確的主題與事實</p></div>
      </section>
      <section id="page-notes" class="page content-page" hidden>
        <header class="page-head"><div class="eyebrow">NOTES</div><h1>主題筆記</h1><p>每段對話留下的事實，都可以整理到這裡。</p></header><div id="notes" class="stack"></div>
      </section>
      <section id="page-sources" class="page content-page" hidden>
        <header class="page-head"><div class="eyebrow">SOURCES</div><h1>來源與修正</h1><p>選一句筆記，查看原話並確認修改範圍。</p></header>
        <div class="detail-grid"><div><div class="section-title">選擇句子</div><div id="claim-list" class="claim-list"></div></div><div><div class="section-title">句子詳情</div><div id="selected" class="selected">請先選擇一個筆記句子。</div><div id="sources"></div><form id="revision-form" hidden><label for="new-value">新的內容</label><input id="new-value" required><label for="kind">修正類型</label><select id="kind"><option value="correction">原本記錯</option><option value="change">後來改變</option></select><label for="effective-from">生效日期（後來改變必填）</label><input id="effective-from" type="date"><label for="reason">修正說明</label><input id="reason" required><button class="button-dark" type="submit">預覽修正</button></form><div id="preview"></div></div></div>
      </section>
      <section id="page-search" class="page content-page" hidden>
        <header class="page-head"><div class="eyebrow">SEARCH</div><h1>查詢記憶</h1><p>搜尋目前記憶，或指定日期回看當時的內容。</p></header><form id="search-form" class="search-form"><label for="search-text">關鍵字</label><input id="search-text" required placeholder="例如：看展"><label for="as-of">查詢當時日期（選填）</label><input id="as-of" type="date"><button class="button-dark" type="submit">搜尋</button></form><div id="results" class="stack"></div><div class="demo-info">Python／SQLite 原型。設定模型服務後可啟用 AI 功能。<a class="button-link" href="https://github.com/c62575998-web/Artificial-Intelligence_AI-Chat-Notes">查看 GitHub</a></div>
      </section>
    </main>
    <nav class="bottom-nav" aria-label="主要頁面">
      <a href="#chat" data-page="chat"><span class="nav-icon" aria-hidden="true">◯</span><span>聊天</span></a>
      <a href="#notes" data-page="notes"><span class="nav-icon" aria-hidden="true">▣</span><span>筆記</span></a>
      <a href="#sources" data-page="sources"><span class="nav-icon" aria-hidden="true">⌁</span><span>來源</span></a>
      <a href="#search" data-page="search"><span class="nav-icon" aria-hidden="true">⌕</span><span>查詢</span></a>
    </nav>
  </div>
  <script type="module" src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
